<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="rxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b" />
      <stop offset="100%" stop-color="#0f1115" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="#2d3340" stroke-width="4" />

  <!-- Outer cinematic accent ring -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#252a36" stroke-width="3" stroke-dasharray="8 6" />

  <!-- RX Geometric Symbol -->
  <g filter="url(#glow)">
    <!-- 'R' Stem and Bowl -->
    <path d="M 68 76 L 68 180 M 68 76 L 106 76 C 124 76 136 86 136 102 C 136 118 124 128 106 128 L 68 128 M 104 128 L 138 180" 
          fill="none" stroke="url(#rxGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Embedded Play Triangle inside 'R' Bowl -->
    <polygon points="90,92 90,112 108,102" fill="#38bdf8" opacity="0.9" />

    <!-- 'X' Crossing Struts -->
    <path d="M 148 100 L 196 180 M 196 100 L 148 180" 
          fill="none" stroke="url(#rxGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sonic Pulse Dot -->
  <circle cx="198" cy="80" r="5" fill="#38bdf8" />
</svg>
